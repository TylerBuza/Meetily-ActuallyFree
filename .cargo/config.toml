[env]
CMAKE_CUDA_ARCHITECTURES = { value = "75;80;86;89;120", force = true }
CMAKE_CUDA_STANDARD = { value = "17", force = true }
CMAKE_CUDA_FLAGS = { value = "--std=c++17 -DCCCL_IGNORE_DEPRECATED_CPP_DIALECT -DCCCL_IGNORE_MSVC_TRADITIONAL_PREPROCESSOR_WARNING -Xcompiler=\"/Zc:preprocessor\"", force = true }
CL = { value = "/DCCCL_IGNORE_DEPRECATED_CPP_DIALECT /DCCCL_IGNORE_MSVC_TRADITIONAL_PREPROCESSOR_WARNING /Zc:preprocessor", force = true }
_CL_ = { value = "/DCCCL_IGNORE_DEPRECATED_CPP_DIALECT /DCCCL_IGNORE_MSVC_TRADITIONAL_PREPROCESSOR_WARNING /Zc:preprocessor", force = true }
