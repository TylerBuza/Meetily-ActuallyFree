<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0b1e57" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- rounded blue app tile -->
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="url(#bg)"/>

  <!-- microphone glyph (white) -->
  <g filter="url(#shadow)" fill="#FFFFFF">
    <rect x="432" y="250" width="160" height="330" rx="80" ry="80"/>
    <path d="M356 470 a156 156 0 0 0 312 0 h-70 a86 86 0 0 1 -172 0 z"/>
    <rect x="482" y="620" width="60" height="120" rx="10"/>
    <rect x="392" y="740" width="240" height="52" rx="26"/>
  </g>

  <!-- FREE ribbon across the bottom-right corner -->
  <g transform="rotate(-20 512 800)">
    <rect x="176" y="770" width="672" height="150" rx="24" fill="url(#ribbon)"/>
    <text x="512" y="875" font-family="Arial, Helvetica, sans-serif" font-size="120" font-weight="800"
          fill="#1E3A8A" text-anchor="middle" letter-spacing="14">FREE</text>
  </g>
</svg>
