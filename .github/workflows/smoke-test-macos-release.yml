name: "Smoke Test - macOS Release"

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Published macOS release tag"
        required: true
        type: string
        default: "v0.2.5-macos"

permissions:
  contents: read

jobs:
  smoke-test:
    name: Launch Published Apple Silicon App
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          test "$(uname -m)" = "arm64"

      - name: Download published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/release"

          cd "$RUNNER_TEMP/release"
          test -f SHA256SUMS-macos.txt
          shasum -a 256 -c SHA256SUMS-macos.txt

      - name: Install and inspect app
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        shell: bash
        run: |
          set -euo pipefail
          assert_macos_compatible() {
            local binary="$1"
            local min_os
            min_os=$(xcrun vtool -arch arm64 -show-build "$binary" 2>/dev/null \
              | awk '$1 == "minos" { print $2; exit }' || true)
            if [[ -z "$min_os" ]]; then
              min_os=$(otool -arch arm64 -l "$binary" | awk '
                $1 == "cmd" && $2 == "LC_VERSION_MIN_MACOSX" { legacy = 1; next }
                legacy && $1 == "version" { print $2; exit }
              ')
            fi
            if [[ -z "$min_os" ]]; then
              echo "Could not determine the Mach-O deployment target: $binary"
              exit 1
            fi
            python3 - "$binary" "$min_os" <<'PY'
          import sys

          binary, version = sys.argv[1:]
          parts = tuple(int(part) for part in version.split("."))
          padded = (parts + (0, 0, 0))[:3]
          if padded > (14, 2, 0):
              raise SystemExit(f"{binary} requires macOS {version}, later than 14.2")
          print(f"{binary}: Mach-O minimum macOS {version}")
          PY
          }

          RELEASE_DIR="$RUNNER_TEMP/release"
          DMG_PATH=$(find "$RELEASE_DIR" -maxdepth 1 -name "*.dmg" -type f -print -quit)
          test -n "$DMG_PATH"
          hdiutil verify "$DMG_PATH"

          MOUNT_POINT="$RUNNER_TEMP/meetily-dmg"
          mkdir -p "$MOUNT_POINT"
          hdiutil attach "$DMG_PATH" -nobrowse -readonly -mountpoint "$MOUNT_POINT"
          trap 'hdiutil detach "$MOUNT_POINT" >/dev/null 2>&1 || true' EXIT

          APP_SOURCE=$(find "$MOUNT_POINT" -maxdepth 1 -name "*.app" -type d -print -quit)
          test -n "$APP_SOURCE"
          mkdir -p "$RUNNER_TEMP/Applications"
          APP_PATH="$RUNNER_TEMP/Applications/$(basename "$APP_SOURCE")"
          ditto "$APP_SOURCE" "$APP_PATH"

          hdiutil detach "$MOUNT_POINT"
          trap - EXIT

          APP_BINARY="$APP_PATH/Contents/MacOS/meetily"
          for binary in \
            "$APP_BINARY" \
            "$APP_PATH/Contents/MacOS/llama-helper" \
            "$APP_PATH/Contents/MacOS/ffmpeg"; do
            test -x "$binary"
            file "$binary" | tee -a "$RUNNER_TEMP/meetily-metadata.log"
            file "$binary" | grep -q "arm64"
            assert_macos_compatible "$binary" \
              | tee -a "$RUNNER_TEMP/meetily-metadata.log"
          done

          "$APP_PATH/Contents/MacOS/ffmpeg" -version
          FFMPEG_TEST="$RUNNER_TEMP/ffmpeg-smoke.m4a"
          "$APP_PATH/Contents/MacOS/ffmpeg" \
            -f lavfi -i "anullsrc=r=48000:cl=mono" \
            -t 0.25 -c:a aac -y "$FFMPEG_TEST"
          test -s "$FFMPEG_TEST"
          FFMPEG_DECODED="$RUNNER_TEMP/ffmpeg-smoke.f32"
          "$APP_PATH/Contents/MacOS/ffmpeg" \
            -v error -i "$FFMPEG_TEST" \
            -f f32le -acodec pcm_f32le -y "$FFMPEG_DECODED"
          test -s "$FFMPEG_DECODED"

          LLAMA_OUTPUT=$(printf '%s\n' '{"type":"ping"}' '{"type":"shutdown"}' \
            | "$APP_PATH/Contents/MacOS/llama-helper")
          echo "$LLAMA_OUTPUT" | tee -a "$RUNNER_TEMP/meetily-metadata.log"
          grep -q '"type":"pong"' <<< "$LLAMA_OUTPUT"
          grep -q '"type":"goodbye"' <<< "$LLAMA_OUTPUT"

          test -f "$APP_PATH/Contents/Resources/icon.icns"
          test -f "$APP_PATH/Contents/Resources/templates/standard_meeting.json"
          test -f "$APP_PATH/Contents/Resources/resources/diarization/segmentation-3.0-fp16.onnx"
          test -f "$APP_PATH/Contents/Resources/resources/diarization/wespeaker-resnet34-LM.onnx"
          test -f "$APP_PATH/Contents/Resources/resources/diarization/xvec_transform.npz"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH" 2>&1 \
            | tee -a "$RUNNER_TEMP/meetily-metadata.log"

          EXPECTED_VERSION="${RELEASE_TAG#v}"
          EXPECTED_VERSION="${EXPECTED_VERSION%-macos}"
          BUNDLE_VERSION=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$APP_PATH/Contents/Info.plist")
          test "$BUNDLE_VERSION" = "$EXPECTED_VERSION"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$APP_PATH/Contents/Info.plist")"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSAudioCaptureUsageDescription' "$APP_PATH/Contents/Info.plist")"
          MINIMUM_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP_PATH/Contents/Info.plist")
          test "$MINIMUM_VERSION" = "14.2"

          ENTITLEMENTS_PATH="$RUNNER_TEMP/meetily-entitlements.plist"
          codesign -d --entitlements :- "$APP_PATH" > "$ENTITLEMENTS_PATH"
          python3 - "$ENTITLEMENTS_PATH" <<'PY'
          import plistlib
          import sys

          with open(sys.argv[1], "rb") as entitlements_file:
              actual = plistlib.load(entitlements_file)
          expected = {"com.apple.security.device.audio-input": True}
          if actual != expected:
              raise SystemExit(f"Unexpected entitlements: {actual!r}")
          PY
          echo "Bundle version: $BUNDLE_VERSION" | tee -a "$RUNNER_TEMP/meetily-metadata.log"
          echo "MEETILY_APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Launch app
        shell: bash
        run: |
          set -euo pipefail
          APP_BINARY="$MEETILY_APP_PATH/Contents/MacOS/meetily"
          LOG_PATH="$RUNNER_TEMP/meetily-launch.log"

          RUST_BACKTRACE=1 RUST_LOG=info "$APP_BINARY" >"$LOG_PATH" 2>&1 &
          APP_PID=$!

          cleanup() {
            if kill -0 "$APP_PID" >/dev/null 2>&1; then
              kill -TERM "$APP_PID" >/dev/null 2>&1 || true
              sleep 2
              kill -KILL "$APP_PID" >/dev/null 2>&1 || true
            fi
            wait "$APP_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          sleep 20
          if ! kill -0 "$APP_PID" >/dev/null 2>&1; then
            wait "$APP_PID" || STATUS=$?
            cat "$LOG_PATH"
            echo "Meetily exited during startup with status ${STATUS:-0}."
            exit 1
          fi

          ps -p "$APP_PID" -o pid=,etime=,command=
          if grep -Eiq \
            "thread .* panicked|fatal runtime error|dyld: Library not loaded|Abort trap|Segmentation fault" \
            "$LOG_PATH"; then
            cat "$LOG_PATH"
            echo "Meetily logged a fatal startup error."
            exit 1
          fi

          grep -q "Application setup complete" "$LOG_PATH"
          grep -q "Fresh database initialized successfully" "$LOG_PATH"
          grep -q "Successfully persisted onboarding status to disk" "$LOG_PATH"
          grep -q "Hardware acceleration support: enabled" "$LOG_PATH"
          echo "Meetily remained running for the 20-second startup smoke test."

      - name: Verify post-launch integrity
        shell: bash
        run: |
          set -euo pipefail
          test -f "$HOME/Library/Application Support/Meetily/meeting_minutes.sqlite"
          test ! -e "$MEETILY_APP_PATH/Contents/MacOS/data"
          codesign --verify --deep --strict --verbose=2 "$MEETILY_APP_PATH" 2>&1 \
            | tee -a "$RUNNER_TEMP/meetily-metadata.log"

      - name: Launch app again
        shell: bash
        run: |
          set -euo pipefail
          APP_BINARY="$MEETILY_APP_PATH/Contents/MacOS/meetily"
          LOG_PATH="$RUNNER_TEMP/meetily-second-launch.log"
          RUST_BACKTRACE=1 RUST_LOG=info "$APP_BINARY" >"$LOG_PATH" 2>&1 &
          APP_PID=$!

          cleanup() {
            if kill -0 "$APP_PID" >/dev/null 2>&1; then
              kill -TERM "$APP_PID" >/dev/null 2>&1 || true
              sleep 2
              kill -KILL "$APP_PID" >/dev/null 2>&1 || true
            fi
            wait "$APP_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          sleep 10
          if ! kill -0 "$APP_PID" >/dev/null 2>&1; then
            wait "$APP_PID" || STATUS=$?
            cat "$LOG_PATH"
            echo "Meetily exited during second launch with status ${STATUS:-0}."
            exit 1
          fi

          if grep -Eiq \
            "thread .* panicked|fatal runtime error|dyld: Library not loaded|Abort trap|Segmentation fault" \
            "$LOG_PATH"; then
            cat "$LOG_PATH"
            echo "Meetily logged a fatal error during second launch."
            exit 1
          fi
          grep -q "Application setup complete" "$LOG_PATH"
          grep -q "Database initialized successfully" "$LOG_PATH"
          cleanup
          trap - EXIT
          codesign --verify --deep --strict --verbose=2 "$MEETILY_APP_PATH"
          echo "Meetily reopened successfully with its existing database."

      - name: Upload smoke-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-smoke-test-logs
          path: |
            ${{ runner.temp }}/meetily-metadata.log
            ${{ runner.temp }}/meetily-launch.log
            ${{ runner.temp }}/meetily-second-launch.log
          if-no-files-found: warn
          retention-days: 30
