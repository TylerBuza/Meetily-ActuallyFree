name: "Build and Release - macOS Apple Silicon"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version; leave blank to use tauri.conf.json"
        required: false
        type: string
      publish-release:
        description: "Create the separate macOS GitHub release"
        required: true
        type: boolean
        default: true
      sign-and-notarize:
        description: "Use configured Apple Developer credentials"
        required: true
        type: boolean
        default: false

concurrency:
  group: macos-apple-silicon-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "13.0"
  TARGET: aarch64-apple-darwin

jobs:
  build-macos:
    name: Build Apple Silicon DMG
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          CONFIG_VERSION=$(node -p "require('./frontend/src-tauri/tauri.conf.json').version")
          REQUESTED_VERSION="${{ inputs.version }}"
          VERSION="${REQUESTED_VERSION:-$CONFIG_VERSION}"

          if [[ "$VERSION" != "$CONFIG_VERSION" ]]; then
            echo "Requested version $VERSION does not match tauri.conf.json ($CONFIG_VERSION)."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-macos" >> "$GITHUB_OUTPUT"

      - name: Ensure macOS release does not already exist
        if: ${{ inputs.publish-release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Refusing to replace published assets."
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust builds
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: macos-aarch64-release

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Import Apple signing certificate
        if: ${{ inputs.sign-and-notarize }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required secret: $name"
              exit 1
            fi
          done

          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/build.keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain"
          security import "$RUNNER_TEMP/certificate.p12" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$RUNNER_TEMP/build.keychain"
          security list-keychain -d user -s "$RUNNER_TEMP/build.keychain"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$RUNNER_TEMP/build.keychain"

          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/build.keychain" \
            | sed -n 's/.*"\(Developer ID Application:.*\)".*/\1/p' \
            | head -n 1)
          if [[ -z "$SIGNING_IDENTITY" ]]; then
            echo "No Developer ID Application identity found."
            exit 1
          fi

          echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
          echo "APPLE_PASSWORD=$APPLE_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"

      - name: Build Apple Silicon llama-helper
        shell: bash
        run: |
          set -euo pipefail
          cargo build \
            --release \
            --package llama-helper \
            --target "$TARGET" \
            --features metal
          mkdir -p frontend/src-tauri/binaries
          cp \
            "target/$TARGET/release/llama-helper" \
            "frontend/src-tauri/binaries/llama-helper-$TARGET"
          chmod +x "frontend/src-tauri/binaries/llama-helper-$TARGET"

      - name: Build DMG
        working-directory: frontend
        shell: bash
        run: pnpm exec tauri build --target "$TARGET" --bundles dmg

      - name: Verify Apple Silicon bundle
        id: artifact
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="target/$TARGET/release/bundle"
          APP_PATH=$(find "$BUNDLE_DIR/macos" -maxdepth 1 -name "*.app" -type d -print -quit)
          DMG_PATH=$(find "$BUNDLE_DIR/dmg" -maxdepth 1 -name "*.dmg" -type f -print -quit)

          if [[ -z "$APP_PATH" || -z "$DMG_PATH" ]]; then
            echo "The expected app bundle or DMG was not produced."
            exit 1
          fi

          APP_BINARY="$APP_PATH/Contents/MacOS/meetily"
          if [[ ! -x "$APP_BINARY" ]]; then
            echo "App executable not found: $APP_BINARY"
            exit 1
          fi
          file "$APP_BINARY" | grep -q "arm64"

          for sidecar in \
            "$APP_PATH/Contents/MacOS/llama-helper" \
            "$APP_PATH/Contents/MacOS/ffmpeg"; do
            if [[ ! -x "$sidecar" ]]; then
              echo "Missing executable sidecar: $sidecar"
              exit 1
            fi
            file "$sidecar" | grep -q "arm64"
          done

          codesign --verify --deep --strict "$APP_PATH"

          mkdir -p dist
          OUTPUT_DMG="dist/Meetily-Actually-Free_${VERSION}_aarch64.dmg"
          cp "$DMG_PATH" "$OUTPUT_DMG"
          (
            cd dist
            shasum -a 256 "$(basename "$OUTPUT_DMG")" > SHA256SUMS-macos.txt
          )

          echo "dmg=$OUTPUT_DMG" >> "$GITHUB_OUTPUT"
          echo "app=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Verify notarization
        if: ${{ inputs.sign-and-notarize }}
        env:
          APP_PATH: ${{ steps.artifact.outputs.app }}
        run: spctl --assess --type execute --verbose "$APP_PATH"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meetily-actually-free-${{ steps.release.outputs.version }}-macos-aarch64
          path: |
            dist/*.dmg
            dist/SHA256SUMS-macos.txt
          if-no-files-found: error
          retention-days: 30

      - name: Write release notes
        if: ${{ inputs.publish-release }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SIGNED: ${{ inputs.sign-and-notarize }}
        shell: bash
        run: |
          {
            echo "## Meetily - Actually Free for macOS"
            echo
            echo "Apple Silicon release for M1 and newer Macs running macOS 13 Ventura or later."
            echo
            echo "### Install"
            echo
            echo "1. Download the \`aarch64.dmg\` file."
            echo "2. Open it and drag Meetily - Actually Free to Applications."
            echo "3. Grant microphone and screen/audio capture permissions when prompted."
            if [[ "$SIGNED" != "true" ]]; then
              echo
              echo "> This build is not Apple-notarized. macOS may require Control-clicking the app and choosing Open on first launch."
            fi
            echo
            echo "The Windows release remains available separately at \`v${VERSION}\`."
          } > dist/release-notes-macos.md

      - name: Publish separate macOS release
        if: ${{ inputs.publish-release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          DMG_PATH: ${{ steps.artifact.outputs.dmg }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            "$DMG_PATH" \
            dist/SHA256SUMS-macos.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Meetily - Actually Free v${VERSION} for macOS" \
            --notes-file dist/release-notes-macos.md \
            --latest=false
