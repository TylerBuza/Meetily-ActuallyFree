name: "Build - macOS Apple Silicon"

on:
  workflow_dispatch:
    inputs:
      sign-and-notarize:
        description: "Use configured Apple Developer credentials"
        required: true
        type: boolean
        default: false

concurrency:
  group: macos-apple-silicon-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "14.2"
  TARGET: aarch64-apple-darwin

jobs:
  build-macos:
    name: Build Apple Silicon DMG
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: macos-release
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./frontend/src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-darwin

      - name: Cache Rust builds
        uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: ". -> target"
          key: macos-aarch64-release

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Import Apple signing certificate
        if: ${{ inputs.sign-and-notarize }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required secret: $name"
              exit 1
            fi
          done

          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/build.keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain"
          security import "$RUNNER_TEMP/certificate.p12" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$RUNNER_TEMP/build.keychain"
          security list-keychain -d user -s "$RUNNER_TEMP/build.keychain"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$RUNNER_TEMP/build.keychain"

          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/build.keychain" \
            | sed -n 's/.*"\(Developer ID Application:.*\)".*/\1/p' \
            | head -n 1)
          if [[ -z "$SIGNING_IDENTITY" ]]; then
            echo "No Developer ID Application identity found."
            exit 1
          fi

          echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Build Apple Silicon llama-helper
        shell: bash
        run: |
          set -euo pipefail
          cargo build \
            --release \
            --package llama-helper \
            --target "$TARGET" \
            --features metal
          mkdir -p frontend/src-tauri/binaries
          cp \
            "target/$TARGET/release/llama-helper" \
            "frontend/src-tauri/binaries/llama-helper-$TARGET"
          chmod +x "frontend/src-tauri/binaries/llama-helper-$TARGET"

      - name: Build unsigned DMG
        if: ${{ !inputs.sign-and-notarize }}
        working-directory: frontend
        shell: bash
        run: pnpm exec tauri build --target "$TARGET" --bundles dmg

      - name: Build signed and notarized DMG
        if: ${{ inputs.sign-and-notarize }}
        working-directory: frontend
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required secret: $name"
              exit 1
            fi
          done
          pnpm exec tauri build --target "$TARGET" --bundles dmg

      - name: Verify Apple Silicon bundle
        id: artifact
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SIGNED: ${{ inputs.sign-and-notarize }}
        run: |
          set -euo pipefail
          assert_macos_compatible() {
            local binary="$1"
            local min_os
            min_os=$(xcrun vtool -arch arm64 -show-build "$binary" 2>/dev/null \
              | awk '$1 == "minos" { print $2; exit }' || true)
            if [[ -z "$min_os" ]]; then
              min_os=$(otool -arch arm64 -l "$binary" | awk '
                $1 == "cmd" && $2 == "LC_VERSION_MIN_MACOSX" { legacy = 1; next }
                legacy && $1 == "version" { print $2; exit }
              ')
            fi
            if [[ -z "$min_os" ]]; then
              echo "Could not determine the Mach-O deployment target: $binary"
              exit 1
            fi
            python3 - "$binary" "$min_os" <<'PY'
          import sys

          binary, version = sys.argv[1:]
          parts = tuple(int(part) for part in version.split("."))
          padded = (parts + (0, 0, 0))[:3]
          if padded > (14, 2, 0):
              raise SystemExit(f"{binary} requires macOS {version}, later than 14.2")
          print(f"{binary}: Mach-O minimum macOS {version}")
          PY
          }

          BUNDLE_DIR="target/$TARGET/release/bundle"
          DMG_PATH=$(find "$BUNDLE_DIR/dmg" -maxdepth 1 -name "*.dmg" -type f -print -quit)

          if [[ -z "$DMG_PATH" ]]; then
            echo "The expected DMG was not produced."
            exit 1
          fi

          MOUNT_POINT="$RUNNER_TEMP/meetily-dmg"
          mkdir -p "$MOUNT_POINT"
          hdiutil attach "$DMG_PATH" -nobrowse -readonly -mountpoint "$MOUNT_POINT"
          trap 'hdiutil detach "$MOUNT_POINT" >/dev/null 2>&1 || true' EXIT

          APP_PATH=$(find "$MOUNT_POINT" -maxdepth 1 -name "*.app" -type d -print -quit)
          if [[ -z "$APP_PATH" ]]; then
            echo "The DMG does not contain an app bundle."
            exit 1
          fi

          APP_BINARY="$APP_PATH/Contents/MacOS/meetily"
          if [[ ! -x "$APP_BINARY" ]]; then
            echo "App executable not found: $APP_BINARY"
            exit 1
          fi
          file "$APP_BINARY" | grep -q "arm64"
          assert_macos_compatible "$APP_BINARY"

          for sidecar in \
            "$APP_PATH/Contents/MacOS/llama-helper" \
            "$APP_PATH/Contents/MacOS/ffmpeg"; do
            if [[ ! -x "$sidecar" ]]; then
              echo "Missing executable sidecar: $sidecar"
              exit 1
            fi
            file "$sidecar" | grep -q "arm64"
            assert_macos_compatible "$sidecar"
          done

          "$APP_PATH/Contents/MacOS/ffmpeg" -version
          FFMPEG_TEST="$RUNNER_TEMP/ffmpeg-smoke.m4a"
          "$APP_PATH/Contents/MacOS/ffmpeg" \
            -f lavfi -i "anullsrc=r=48000:cl=mono" \
            -t 0.25 -c:a aac -y "$FFMPEG_TEST"
          test -s "$FFMPEG_TEST"
          FFMPEG_DECODED="$RUNNER_TEMP/ffmpeg-smoke.f32"
          "$APP_PATH/Contents/MacOS/ffmpeg" \
            -v error -i "$FFMPEG_TEST" \
            -f f32le -acodec pcm_f32le -y "$FFMPEG_DECODED"
          test -s "$FFMPEG_DECODED"

          LLAMA_OUTPUT=$(printf '%s\n' '{"type":"ping"}' '{"type":"shutdown"}' \
            | "$APP_PATH/Contents/MacOS/llama-helper")
          echo "$LLAMA_OUTPUT"
          grep -q '"type":"pong"' <<< "$LLAMA_OUTPUT"
          grep -q '"type":"goodbye"' <<< "$LLAMA_OUTPUT"

          test -f "$APP_PATH/Contents/Resources/icon.icns"
          test -f "$APP_PATH/Contents/Resources/templates/standard_meeting.json"
          test -f "$APP_PATH/Contents/Resources/resources/diarization/segmentation-3.0-fp16.onnx"
          test -f "$APP_PATH/Contents/Resources/resources/diarization/wespeaker-resnet34-LM.onnx"
          test -f "$APP_PATH/Contents/Resources/resources/diarization/xvec_transform.npz"

          INFO_PLIST="$APP_PATH/Contents/Info.plist"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$INFO_PLIST")"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSAudioCaptureUsageDescription' "$INFO_PLIST")"
          MINIMUM_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$INFO_PLIST")
          test "$MINIMUM_VERSION" = "14.2"

          ENTITLEMENTS_PATH="$RUNNER_TEMP/meetily-entitlements.plist"
          codesign -d --entitlements :- "$APP_PATH" > "$ENTITLEMENTS_PATH"
          python3 - "$ENTITLEMENTS_PATH" <<'PY'
          import plistlib
          import sys

          with open(sys.argv[1], "rb") as entitlements_file:
              actual = plistlib.load(entitlements_file)
          expected = {"com.apple.security.device.audio-input": True}
          if actual != expected:
              raise SystemExit(f"Unexpected entitlements: {actual!r}")
          PY

          codesign --verify --deep --strict "$APP_PATH"
          if [[ "$SIGNED" == "true" ]]; then
            SIGN_DETAILS=$(codesign -dv --verbose=4 "$APP_PATH" 2>&1)
            grep -q '^Authority=Developer ID Application:' <<< "$SIGN_DETAILS"
            grep -Eq '^TeamIdentifier=[A-Z0-9]+$' <<< "$SIGN_DETAILS"
            spctl --assess --type execute --verbose "$APP_PATH"
            xcrun stapler validate "$APP_PATH"
            spctl --assess \
              --type open \
              --context context:primary-signature \
              --verbose "$DMG_PATH"
          fi

          INSTALLED_APP="$RUNNER_TEMP/Applications/$(basename "$APP_PATH")"
          mkdir -p "$RUNNER_TEMP/Applications"
          ditto "$APP_PATH" "$INSTALLED_APP"

          hdiutil detach "$MOUNT_POINT"
          trap - EXIT

          APP_BINARY="$INSTALLED_APP/Contents/MacOS/meetily"
          LOG_PATH="$RUNNER_TEMP/meetily-launch.log"
          RUST_BACKTRACE=1 RUST_LOG=info "$APP_BINARY" >"$LOG_PATH" 2>&1 &
          APP_PID=$!

          cleanup_app() {
            if kill -0 "$APP_PID" >/dev/null 2>&1; then
              kill -TERM "$APP_PID" >/dev/null 2>&1 || true
              sleep 2
              kill -KILL "$APP_PID" >/dev/null 2>&1 || true
            fi
            wait "$APP_PID" >/dev/null 2>&1 || true
          }
          trap cleanup_app EXIT

          sleep 20
          if ! kill -0 "$APP_PID" >/dev/null 2>&1; then
            wait "$APP_PID" || STATUS=$?
            cat "$LOG_PATH"
            echo "Meetily exited during startup with status ${STATUS:-0}."
            exit 1
          fi

          for milestone in \
            "Application setup complete" \
            "Fresh database initialized successfully" \
            "Successfully persisted onboarding status to disk" \
            "Hardware acceleration support: enabled"; do
            if ! grep -q "$milestone" "$LOG_PATH"; then
              cat "$LOG_PATH"
              echo "Missing startup milestone: $milestone"
              exit 1
            fi
          done

          cleanup_app
          trap - EXIT

          DATA_ROOT="$HOME/Library/Application Support/Meetily"
          test -f "$DATA_ROOT/meeting_minutes.sqlite"
          test ! -e "$INSTALLED_APP/Contents/MacOS/data"
          codesign --verify --deep --strict "$INSTALLED_APP"

          SECOND_LOG="$RUNNER_TEMP/meetily-second-launch.log"
          RUST_BACKTRACE=1 RUST_LOG=info "$APP_BINARY" >"$SECOND_LOG" 2>&1 &
          SECOND_PID=$!
          cleanup_second() {
            if kill -0 "$SECOND_PID" >/dev/null 2>&1; then
              kill -TERM "$SECOND_PID" >/dev/null 2>&1 || true
              sleep 2
              kill -KILL "$SECOND_PID" >/dev/null 2>&1 || true
            fi
            wait "$SECOND_PID" >/dev/null 2>&1 || true
          }
          trap cleanup_second EXIT
          sleep 10
          if ! kill -0 "$SECOND_PID" >/dev/null 2>&1; then
            wait "$SECOND_PID" || STATUS=$?
            cat "$SECOND_LOG"
            echo "Meetily exited during second launch with status ${STATUS:-0}."
            exit 1
          fi
          if grep -Eiq \
            "thread .* panicked|fatal runtime error|dyld: Library not loaded|Abort trap|Segmentation fault" \
            "$SECOND_LOG"; then
            cat "$SECOND_LOG"
            echo "Meetily logged a fatal error during second launch."
            exit 1
          fi
          grep -q "Application setup complete" "$SECOND_LOG"
          grep -q "Database initialized successfully" "$SECOND_LOG"
          cleanup_second
          trap - EXIT
          codesign --verify --deep --strict "$INSTALLED_APP"

          mkdir -p dist
          OUTPUT_DMG="dist/Meetily-Actually-Free_${VERSION}_aarch64.dmg"
          cp "$DMG_PATH" "$OUTPUT_DMG"
          (
            cd dist
            shasum -a 256 "$(basename "$OUTPUT_DMG")" > SHA256SUMS-macos.txt
          )
          DMG_SHA256=$(shasum -a 256 "$OUTPUT_DMG" | awk '{print $1}')
          jq -n \
            --arg version "$VERSION" \
            --arg commit "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg dmg_sha256 "$DMG_SHA256" \
            --argjson notarized '${{ inputs.sign-and-notarize }}' \
            '{
              version: $version,
              commit: $commit,
              run_id: $run_id,
              run_attempt: $run_attempt,
              dmg_sha256: $dmg_sha256,
              notarized: $notarized
            }' \
            > dist/macos-build-metadata.json

          echo "dmg=$OUTPUT_DMG" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meetily-actually-free-${{ steps.release.outputs.version }}-macos-aarch64
          path: |
            dist/*.dmg
            dist/SHA256SUMS-macos.txt
            dist/macos-build-metadata.json
            ${{ runner.temp }}/meetily-launch.log
            ${{ runner.temp }}/meetily-second-launch.log
          if-no-files-found: error
          retention-days: 30
