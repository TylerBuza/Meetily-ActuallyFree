name: "Build and Release - macOS Apple Silicon"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version; leave blank to use tauri.conf.json"
        required: false
        type: string
      publish-release:
        description: "Create the separate macOS GitHub release"
        required: true
        type: boolean
        default: true
      sign-and-notarize:
        description: "Use configured Apple Developer credentials"
        required: true
        type: boolean
        default: false

concurrency:
  group: macos-apple-silicon-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "14.2"
  TARGET: aarch64-apple-darwin

jobs:
  build-macos:
    name: Build Apple Silicon DMG
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          CONFIG_VERSION=$(node -p "require('./frontend/src-tauri/tauri.conf.json').version")
          REQUESTED_VERSION="${{ inputs.version }}"
          VERSION="${REQUESTED_VERSION:-$CONFIG_VERSION}"

          if [[ "$VERSION" != "$CONFIG_VERSION" ]]; then
            echo "Requested version $VERSION does not match tauri.conf.json ($CONFIG_VERSION)."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-macos" >> "$GITHUB_OUTPUT"

      - name: Ensure macOS release does not already exist
        if: ${{ inputs.publish-release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Refusing to replace published assets."
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust builds
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: macos-aarch64-release

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Import Apple signing certificate
        if: ${{ inputs.sign-and-notarize }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required secret: $name"
              exit 1
            fi
          done

          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/build.keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain"
          security import "$RUNNER_TEMP/certificate.p12" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$RUNNER_TEMP/build.keychain"
          security list-keychain -d user -s "$RUNNER_TEMP/build.keychain"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$RUNNER_TEMP/build.keychain"

          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/build.keychain" \
            | sed -n 's/.*"\(Developer ID Application:.*\)".*/\1/p' \
            | head -n 1)
          if [[ -z "$SIGNING_IDENTITY" ]]; then
            echo "No Developer ID Application identity found."
            exit 1
          fi

          echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
          echo "APPLE_PASSWORD=$APPLE_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"

      - name: Build Apple Silicon llama-helper
        shell: bash
        run: |
          set -euo pipefail
          cargo build \
            --release \
            --package llama-helper \
            --target "$TARGET" \
            --features metal
          mkdir -p frontend/src-tauri/binaries
          cp \
            "target/$TARGET/release/llama-helper" \
            "frontend/src-tauri/binaries/llama-helper-$TARGET"
          chmod +x "frontend/src-tauri/binaries/llama-helper-$TARGET"

      - name: Build DMG
        working-directory: frontend
        shell: bash
        run: pnpm exec tauri build --target "$TARGET" --bundles dmg

      - name: Verify Apple Silicon bundle
        id: artifact
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SIGNED: ${{ inputs.sign-and-notarize }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="target/$TARGET/release/bundle"
          DMG_PATH=$(find "$BUNDLE_DIR/dmg" -maxdepth 1 -name "*.dmg" -type f -print -quit)

          if [[ -z "$DMG_PATH" ]]; then
            echo "The expected DMG was not produced."
            exit 1
          fi

          MOUNT_POINT="$RUNNER_TEMP/meetily-dmg"
          mkdir -p "$MOUNT_POINT"
          hdiutil attach "$DMG_PATH" -nobrowse -readonly -mountpoint "$MOUNT_POINT"
          trap 'hdiutil detach "$MOUNT_POINT" >/dev/null 2>&1 || true' EXIT

          APP_PATH=$(find "$MOUNT_POINT" -maxdepth 1 -name "*.app" -type d -print -quit)
          if [[ -z "$APP_PATH" ]]; then
            echo "The DMG does not contain an app bundle."
            exit 1
          fi

          APP_BINARY="$APP_PATH/Contents/MacOS/meetily"
          if [[ ! -x "$APP_BINARY" ]]; then
            echo "App executable not found: $APP_BINARY"
            exit 1
          fi
          file "$APP_BINARY" | grep -q "arm64"

          for sidecar in \
            "$APP_PATH/Contents/MacOS/llama-helper" \
            "$APP_PATH/Contents/MacOS/ffmpeg"; do
            if [[ ! -x "$sidecar" ]]; then
              echo "Missing executable sidecar: $sidecar"
              exit 1
            fi
            file "$sidecar" | grep -q "arm64"
          done

          "$APP_PATH/Contents/MacOS/ffmpeg" -version
          FFMPEG_TEST="$RUNNER_TEMP/ffmpeg-smoke.m4a"
          "$APP_PATH/Contents/MacOS/ffmpeg" \
            -f lavfi -i "anullsrc=r=48000:cl=mono" \
            -t 0.25 -c:a aac -y "$FFMPEG_TEST"
          test -s "$FFMPEG_TEST"

          LLAMA_OUTPUT=$(printf '%s\n' '{"type":"ping"}' '{"type":"shutdown"}' \
            | "$APP_PATH/Contents/MacOS/llama-helper")
          echo "$LLAMA_OUTPUT"
          grep -q '"type":"pong"' <<< "$LLAMA_OUTPUT"
          grep -q '"type":"goodbye"' <<< "$LLAMA_OUTPUT"

          INFO_PLIST="$APP_PATH/Contents/Info.plist"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$INFO_PLIST")"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSAudioCaptureUsageDescription' "$INFO_PLIST")"
          MINIMUM_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$INFO_PLIST")
          test "$MINIMUM_VERSION" = "14.2"

          ENTITLEMENTS_PATH="$RUNNER_TEMP/meetily-entitlements.plist"
          codesign -d --entitlements :- "$APP_PATH" > "$ENTITLEMENTS_PATH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.device.audio-input' "$ENTITLEMENTS_PATH")" = "true"

          codesign --verify --deep --strict "$APP_PATH"
          if [[ "$SIGNED" == "true" ]]; then
            spctl --assess --type execute --verbose "$APP_PATH"
          fi

          INSTALLED_APP="$RUNNER_TEMP/Applications/$(basename "$APP_PATH")"
          mkdir -p "$RUNNER_TEMP/Applications"
          ditto "$APP_PATH" "$INSTALLED_APP"

          hdiutil detach "$MOUNT_POINT"
          trap - EXIT

          APP_BINARY="$INSTALLED_APP/Contents/MacOS/meetily"
          LOG_PATH="$RUNNER_TEMP/meetily-launch.log"
          RUST_BACKTRACE=1 RUST_LOG=info "$APP_BINARY" >"$LOG_PATH" 2>&1 &
          APP_PID=$!

          cleanup_app() {
            if kill -0 "$APP_PID" >/dev/null 2>&1; then
              kill -TERM "$APP_PID" >/dev/null 2>&1 || true
              sleep 2
              kill -KILL "$APP_PID" >/dev/null 2>&1 || true
            fi
            wait "$APP_PID" >/dev/null 2>&1 || true
          }
          trap cleanup_app EXIT

          sleep 20
          if ! kill -0 "$APP_PID" >/dev/null 2>&1; then
            wait "$APP_PID" || STATUS=$?
            cat "$LOG_PATH"
            echo "Meetily exited during startup with status ${STATUS:-0}."
            exit 1
          fi

          for milestone in \
            "Application setup complete" \
            "Fresh database initialized successfully" \
            "Successfully persisted onboarding status to disk" \
            "Hardware acceleration support: enabled"; do
            if ! grep -q "$milestone" "$LOG_PATH"; then
              cat "$LOG_PATH"
              echo "Missing startup milestone: $milestone"
              exit 1
            fi
          done

          cleanup_app
          trap - EXIT

          DATA_ROOT="$HOME/Library/Application Support/Meetily"
          test -f "$DATA_ROOT/meeting_minutes.sqlite"
          test ! -e "$INSTALLED_APP/Contents/MacOS/data"
          codesign --verify --deep --strict "$INSTALLED_APP"

          SECOND_LOG="$RUNNER_TEMP/meetily-second-launch.log"
          RUST_BACKTRACE=1 RUST_LOG=info "$APP_BINARY" >"$SECOND_LOG" 2>&1 &
          SECOND_PID=$!
          cleanup_second() {
            if kill -0 "$SECOND_PID" >/dev/null 2>&1; then
              kill -TERM "$SECOND_PID" >/dev/null 2>&1 || true
              sleep 2
              kill -KILL "$SECOND_PID" >/dev/null 2>&1 || true
            fi
            wait "$SECOND_PID" >/dev/null 2>&1 || true
          }
          trap cleanup_second EXIT
          sleep 10
          if ! kill -0 "$SECOND_PID" >/dev/null 2>&1; then
            wait "$SECOND_PID" || STATUS=$?
            cat "$SECOND_LOG"
            echo "Meetily exited during second launch with status ${STATUS:-0}."
            exit 1
          fi
          if grep -Eiq \
            "thread .* panicked|fatal runtime error|dyld: Library not loaded|Abort trap|Segmentation fault" \
            "$SECOND_LOG"; then
            cat "$SECOND_LOG"
            echo "Meetily logged a fatal error during second launch."
            exit 1
          fi
          grep -q "Application setup complete" "$SECOND_LOG"
          grep -q "Database initialized successfully" "$SECOND_LOG"
          cleanup_second
          trap - EXIT
          codesign --verify --deep --strict "$INSTALLED_APP"

          mkdir -p dist
          OUTPUT_DMG="dist/Meetily-Actually-Free_${VERSION}_aarch64.dmg"
          cp "$DMG_PATH" "$OUTPUT_DMG"
          (
            cd dist
            shasum -a 256 "$(basename "$OUTPUT_DMG")" > SHA256SUMS-macos.txt
          )

          echo "dmg=$OUTPUT_DMG" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meetily-actually-free-${{ steps.release.outputs.version }}-macos-aarch64
          path: |
            dist/*.dmg
            dist/SHA256SUMS-macos.txt
            ${{ runner.temp }}/meetily-launch.log
            ${{ runner.temp }}/meetily-second-launch.log
          if-no-files-found: error
          retention-days: 30

      - name: Write release notes
        if: ${{ inputs.publish-release }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SIGNED: ${{ inputs.sign-and-notarize }}
        shell: bash
        run: |
          {
            echo "## Meetily - Actually Free for macOS"
            echo
            echo "Apple Silicon release for M1 and newer Macs running macOS 14.2 Sonoma or later."
            echo
            echo "### Install"
            echo
            echo "1. Download the \`aarch64.dmg\` file."
            echo "2. Open it and drag Meetily - Actually Free to Applications."
            echo "3. Grant microphone and screen/audio capture permissions when prompted."
            if [[ "$SIGNED" != "true" ]]; then
              echo
              echo "> This build is not Apple-notarized. macOS may require Control-clicking the app and choosing Open on first launch."
            fi
            echo
            echo "The Windows release remains available separately at \`v${VERSION}\`."
          } > dist/release-notes-macos.md

      - name: Publish separate macOS release
        if: ${{ inputs.publish-release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          DMG_PATH: ${{ steps.artifact.outputs.dmg }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            "$DMG_PATH" \
            dist/SHA256SUMS-macos.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Meetily - Actually Free v${VERSION} for macOS" \
            --notes-file dist/release-notes-macos.md \
            --latest=false
