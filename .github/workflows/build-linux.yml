name: Linux candidates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build-linux.yml'
      - 'frontend/src-tauri/**'
      - 'frontend/src/**'
      - 'frontend/tests/**'
      - 'frontend/scripts/*linux*'
      - 'frontend/pnpm-lock.yaml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'llama-helper/**'

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        backend: [cpu, vulkan]
    env:
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
      CARGO_HTTP_MULTIPLEXING: 'false'
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
      APPIMAGE_EXTRACT_AND_RUN: '1'
      NO_STRIP: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.9.0'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: linux-${{ matrix.backend }}
      - name: Native and media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config clang libclang-dev \
            libasound2-dev libpulse-dev libssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libvulkan-dev glslang-tools glslc \
            pulseaudio pulseaudio-utils ffmpeg xvfb xauth x11-utils dbus-x11 \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - name: Frontend checks
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm dlx bun@1.4.0 test tests/lib/audio-devices.test.ts
          pnpm dlx bun@1.4.0 test tests/hooks/meeting-audio.test.tsx
          pnpm dlx bun@1.4.0 test tests/audio-levels/linux-onboarding.test.tsx
          pnpm exec tsc --noEmit
      - name: Build candidate
        run: bash frontend/scripts/build-linux.sh "${{ matrix.backend }}"
      - name: Native regressions
        working-directory: frontend/src-tauri
        run: |
          cargo test --locked -p meetily --lib --no-default-features audio:: -- --test-threads=2
          cargo test --locked -p meetily --lib --no-default-features meeting_audio_tests
      - name: Isolated synthetic capture
        run: bash frontend/scripts/test-linux-audio.sh
      - name: Verify payloads
        run: python3 frontend/scripts/verify-linux-package.py target/release/bundle --smoke
      - name: Artifact provenance
        working-directory: target/release/bundle
        run: |
          git rev-parse HEAD > SOURCE_COMMIT.txt
          rustc -Vv > TOOLCHAIN.txt
          sha256sum deb/*.deb appimage/*.AppImage > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.backend }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/*.txt
            target/release/bundle/SHA256SUMS
      - name: Qualification scope
        run: |
          echo 'Linux candidate: synthetic PulseAudio tests and package checks. Physical PipeWire, microphone, Bluetooth, GPU inference, and upgrade testing remain separate. No release was published.' >> "$GITHUB_STEP_SUMMARY"
